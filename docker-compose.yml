version: '3.8'

services:
  # PostgreSQL 15 - Base de données principale
  postgres:
    image: postgres:15-alpine
    container_name: eletroposto_db
    environment:
      POSTGRES_DB: eletroposto
      POSTGRES_USER: sylius
      POSTGRES_PASSWORD: sylius_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=pt_BR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - eletroposto_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sylius"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 - Cache e sessões
  redis:
    image: redis:7-alpine
    container_name: eletroposto_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - eletroposto_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PHP-FPM 8.3 com Sylius
  php:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.php
      args:
        PHP_VERSION: 8.3
    container_name: eletroposto_php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./infrastructure/docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./infrastructure/docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
    environment:
      APP_ENV: dev
      APP_SECRET: ChangeMe_SecretKey_ForProduction
      DATABASE_URL: postgresql://sylius:sylius_password@postgres:5432/eletroposto?serverVersion=15&charset=utf8
      REDIS_URL: redis://redis:6379
      MAILER_DSN: smtp://mailhog:1025
      MESSENGER_TRANSPORT_DSN: doctrine://default
      PHP_DATE_TIMEZONE: America/Belem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eletroposto_network

  # Nginx - Servidor web
  nginx:
    image: nginx:1.25-alpine
    container_name: eletroposto_nginx
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
    networks:
      - eletroposto_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket Server (Ratchet) - Para OCPP
  websocket:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.websocket
    container_name: eletroposto_websocket
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://sylius:sylius_password@postgres:5432/eletroposto?serverVersion=15&charset=utf8
      REDIS_URL: redis://redis:6379
      WEBSOCKET_PORT: 9000
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eletroposto_network
    restart: unless-stopped

  # MailHog - Servidor SMTP de desenvolvimento
  mailhog:
    image: mailhog/mailhog:latest
    container_name: eletroposto_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Interface Web
    networks:
      - eletroposto_network

  # Node.js - Para build de assets (Webpack Encore)
  node:
    image: node:20-alpine
    container_name: eletroposto_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run watch"
    networks:
      - eletroposto_network

  # Adminer - Interface de administração da base de dados
  adminer:
    image: adminer:latest
    container_name: eletroposto_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - eletroposto_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  node_modules:
    driver: local

networks:
  eletroposto_network:
    driver: bridge
