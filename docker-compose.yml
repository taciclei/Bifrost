# 🌈⚡ Bifrost - Electric Vehicle Charging Platform
# Docker Compose - Development Environment
# Architecture: API Platform + Hydra + Sylius + FrankenPHP + Mercure + OCPP

services:
  # =====================================
  # PHP + FrankenPHP (API Platform + Sylius)
  # Modern PHP app server with HTTP/2, HTTP/3, Mercure
  # =====================================
  php:
    build:
      context: ./app
      dockerfile: ../docker/php/Dockerfile
      target: frankenphp_dev
    container_name: bifrost-php
    restart: unless-stopped
    volumes:
      - ./app:/app:rw,cached
      - ./docker/php/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/app.ini:ro
      - ./docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - php_socket:/var/run/php
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "443:443/udp" # HTTP/3
      - "2019:2019"  # Caddy metrics/admin
    environment:
      # Symfony/Sylius
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: ${APP_SECRET:-!ChangeMe!}

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-bifrost}:${POSTGRES_PASSWORD:-bifrost}@database:5432/${POSTGRES_DB:-bifrost}?serverVersion=16&charset=utf8

      # Mercure (Real-time updates)
      MERCURE_URL: ${MERCURE_URL:-http://localhost/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://localhost/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}

      # Redis
      REDIS_URL: redis://redis:6379

      # Mailer
      MAILER_DSN: smtp://mailhog:1025

      # Messenger (async processing)
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0

      # API Platform
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$}

      # OCPP WebSocket
      OCPP_WEBSOCKET_HOST: ${OCPP_WEBSOCKET_HOST:-0.0.0.0}
      OCPP_WEBSOCKET_PORT: ${OCPP_WEBSOCKET_PORT:-9000}

      # FrankenPHP
      SERVER_NAME: ${SERVER_NAME:-localhost, caddy:80}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG:-worker ./public/index.php}

      # Timezone
      TZ: America/Sao_Paulo
      PHP_DATE_TIMEZONE: America/Sao_Paulo
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2019/metrics"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s

  # =====================================
  # PostgreSQL 16 - Database
  # =====================================
  database:
    image: postgres:16-alpine
    container_name: bifrost-database
    restart: unless-stopped
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bifrost}
      POSTGRES_USER: ${POSTGRES_USER:-bifrost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bifrost}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=pt_BR.UTF-8"
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bifrost}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # =====================================
  # Redis 7 - Cache & Session Storage
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: bifrost-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =====================================
  # PWA - Next.js Frontend (API Consumer)
  # =====================================
  pwa:
    build:
      context: ./pwa
      dockerfile: ../docker/pwa/Dockerfile
      target: dev
    container_name: bifrost-pwa
    restart: unless-stopped
    volumes:
      - ./pwa:/app:rw,cached
      - pwa_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # API Connection
      NEXT_PUBLIC_API_ENTRYPOINT: ${NEXT_PUBLIC_API_ENTRYPOINT:-https://localhost}
      NEXT_PUBLIC_MERCURE_URL: ${NEXT_PUBLIC_MERCURE_URL:-https://localhost/.well-known/mercure}

      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-!ChangeThisNextAuthSecret!}

      # OIDC/OAuth (Keycloak or other)
      OIDC_SERVER_URL: ${OIDC_SERVER_URL:-http://keycloak:8080/realms/bifrost}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-bifrost-pwa}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}

      # Development
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    depends_on:
      - php
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # =====================================
  # OCPP WebSocket Server
  # Handles OCPP 1.6 / 2.0.1 charge point connections
  # =====================================
  ocpp:
    build:
      context: ./app
      dockerfile: ../docker/ocpp/Dockerfile
      target: ocpp_server
    container_name: bifrost-ocpp
    restart: unless-stopped
    volumes:
      - ./app:/app:ro
    ports:
      - "9000:9000"   # WebSocket (ws://)
      - "9443:9443"   # WebSocket Secure (wss://)
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-bifrost}:${POSTGRES_PASSWORD:-bifrost}@database:5432/${POSTGRES_DB:-bifrost}?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379

      # OCPP Configuration
      OCPP_VERSION: ${OCPP_VERSION:-1.6}
      OCPP_SUPPORTED_VERSIONS: ${OCPP_SUPPORTED_VERSIONS:-1.6,2.0.1}
      OCPP_WEBSOCKET_HOST: ${OCPP_WEBSOCKET_HOST:-0.0.0.0}
      OCPP_WEBSOCKET_PORT: ${OCPP_WEBSOCKET_PORT:-9000}
      OCPP_WSS_PORT: ${OCPP_WSS_PORT:-9443}

      # Security
      OCPP_REQUIRE_AUTH: ${OCPP_REQUIRE_AUTH:-false}
      OCPP_TLS_CERT: ${OCPP_TLS_CERT:-/certs/server.crt}
      OCPP_TLS_KEY: ${OCPP_TLS_KEY:-/certs/server.key}

      TZ: America/Sao_Paulo
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 3s
      retries: 3

  # =====================================
  # Keycloak - OIDC/OAuth2 Authentication
  # =====================================
  keycloak:
    image: quay.io/keycloak/keycloak:23-alpine
    container_name: bifrost-keycloak
    restart: unless-stopped
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://localhost:8080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # =====================================
  # Keycloak Database
  # =====================================
  keycloak-db:
    image: postgres:16-alpine
    container_name: bifrost-keycloak-db
    restart: unless-stopped
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =====================================
  # MailHog - SMTP Testing
  # =====================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: bifrost-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 3

  # =====================================
  # pgAdmin - PostgreSQL Management
  # =====================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bifrost-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@bifrost.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-bifrost}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database

  # =====================================
  # Messenger Consumer - Async Processing
  # =====================================
  messenger:
    build:
      context: ./app
      dockerfile: ../docker/php/Dockerfile
      target: frankenphp_dev
    container_name: bifrost-messenger
    restart: unless-stopped
    command: php bin/console messenger:consume async -vv
    volumes:
      - ./app:/app:rw
      - ./docker/php/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/app.ini:ro
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-bifrost}:${POSTGRES_PASSWORD:-bifrost}@database:5432/${POSTGRES_DB:-bifrost}?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      TZ: America/Sao_Paulo
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  database_data:
    driver: local
  keycloak_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  pgadmin_data:
    driver: local
  php_socket:
    driver: local
  pwa_node_modules:
    driver: local

networks:
  default:
    name: bifrost_network
    driver: bridge
