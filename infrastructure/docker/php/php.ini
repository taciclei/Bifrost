; Configuração PHP para Sylius/Symfony
; Ambiente: Desenvolvimento/Produção

[PHP]
; Configurações gerais
expose_php = Off
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Uploads
upload_max_filesize = 20M
post_max_size = 20M
max_file_uploads = 20

; Timezone
date.timezone = America/Belem

; Erros (ajustar para produção)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php/error.log

; Session
session.save_handler = redis
session.save_path = "tcp://redis:6379"
session.gc_maxlifetime = 3600
session.cookie_httponly = 1
session.cookie_secure = 0  ; Mudar para 1 em produção com HTTPS
session.cookie_samesite = Lax

; OPcache (otimizado para Symfony)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1  ; 0 em produção
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Realpath cache (importante para Symfony)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; APCu
apc.enable_cli = 1
apc.shm_size = 128M

; Security
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
allow_url_fopen = On
allow_url_include = Off

; Intl
intl.default_locale = pt_BR
intl.error_level = 0

; Mbstring
mbstring.language = Portuguese
mbstring.internal_encoding = UTF-8
mbstring.http_output = UTF-8
mbstring.encoding_translation = On
